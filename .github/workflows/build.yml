name: Build macOS app

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build app bundle
        shell: bash
        run: |
          set -euo pipefail
          APP="build/Wallpaper Studio.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          swiftc -O WallpaperStudio.swift \
            -o "$APP/Contents/MacOS/BatmanLiveWallpaper"
          cp Info.plist "$APP/Contents/Info.plist"
          cp Resources/BatmanLiveWallpaper.icns \
            "$APP/Contents/Resources/BatmanLiveWallpaper.icns"

      - name: Create installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent \
            "build/Wallpaper Studio.app" \
            "build/Wallpaper-Studio-macos.zip"

      - name: Create installable DMG
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/dmg
          mkdir -p build/dmg
          cp -R "build/Wallpaper Studio.app" build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create \
            -volname "Wallpaper Studio" \
            -srcfolder build/dmg \
            -ov \
            -format UDZO \
            "build/Wallpaper-Studio-macos.dmg"

      - name: Upload installable app
        uses: actions/upload-artifact@v4
        with:
          name: Wallpaper-Studio-macos
          path: |
            build/Wallpaper-Studio-macos.zip
            build/Wallpaper-Studio-macos.dmg
          if-no-files-found: error
